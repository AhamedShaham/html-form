<!DOCTYPE html>
<html lan="eng">
<head> 
  <meta charset="UTF-8">
  <title>form</title>
</head>
<body>
  <h1>Contact Me</h1>
  <form action="#" method="post">
    <label for="name" >Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>
    
    <label for="email">Email:</label><br>
    <input type="email" id="email" email="email" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" password="password" required><br><br>

    <p>Gender</p>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br><br>
    <label for="country">Country:</label>
    <select id="country" name="country">
      <option>Srilanka</option>
      <option>london</option>
      <option>canada</option>
    </select><br><br>

    <label for="msg">Message:</label><br><br>
    <textarea id="msg"name="msg" rows="4" cols="30"></textarea><br><br>

    <input type="checkbox" id="terms" name="terms" required>
    <label for="msg" >I agree to the terms</label><br><br>
    <button type="submit" >Submit</button>
  </form>
</body>
</html>
